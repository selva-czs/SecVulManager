# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/secvulmanager
spring.datasource.username=selva
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Server Configuration
server.port=8080

# Logging Configurations
logging.level.org.springframework.web=INFO
logging.level.com.secvulmanager=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Custom Ingestion File Configs
secvulmanager.failed-uploads-dir=./failed-uploads
secvulmanager.scan-uploads-dir=./scan-uploads
secvulmanager.ingestion.batch-size=500
secvulmanager.ingestion.max-rows=200000
secvulmanager.ingestion.max-columns=300
secvulmanager.ingestion.max-xls-size-bytes=15728640
secvulmanager.ingestion.max-xlsx-size-bytes=52428800
